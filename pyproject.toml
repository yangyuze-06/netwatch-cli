[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netwatch-cli"
version = "0.9.3"
description = "A lightweight interactive command-line network status tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
    "requests>=2.31",
    "rich>=13.0",
    "speedtest-cli>=2.1",
    "reverse-geocoder>=1.5.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0"]
all = ["playwright>=1.44", "pytest>=8.0", "shapely>=2.0"]
geo = ["reverse-geocoder>=1.5.1", "shapely>=2.0"]

[project.scripts]
netwatch = "netwatch.cli:main"

[tool.setuptools.packages.find]
include = ["netwatch*"]

[tool.setuptools.package-data]
netwatch = [
    "location/data/README.md",
    "location/data/china_district_centers.csv",
    "location/data/boundaries/README.md",
    "location/data/boundaries/*.geojson",
    "location/data/roads/README.md",
    "location/data/roads/*.geojson",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
